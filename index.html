<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>whatisthebestmodel</title>
    <script>
      window.va = window.va || function () {
        (window.vaq = window.vaq || []).push(arguments);
      };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: Arial, sans-serif;
      }

      p {
        margin: 0.5rem 1rem;
      }

      #model-name {
        font-size: clamp(3rem, 12vw, 8rem);
        font-weight: 700;
      }

      #company-name {
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <p>
      It is currently <span id="current-datetime"></span>
      <span id="current-timezone"></span>
    </p>

    <p>The best AI model in the world is:</p>
    <p id="model-name" contenteditable="true">GPT-6 Astra</p>
    <p>by</p>
    <p id="company-name" contenteditable="true">OpenAI</p>

    <script>
      function updateDateTime() {
        const now = new Date();
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        document.getElementById("current-datetime").textContent =
          now.toLocaleString();
        document.getElementById("current-timezone").textContent = timezone;
      }

      updateDateTime();
      setInterval(updateDateTime, 1000);
    </script>
  </body>
</html>
